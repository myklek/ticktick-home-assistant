get_task:
  name: Get Task
  description: "Returns a task by Project ID and Task ID from TickTick."
  fields:
    projectId:
      name: Project ID
      description: ID of the project (list) of tasks in TickTick.
      required: true
      example: 6987a8plg0rad90bc38b672f
      selector:
        text: null
    taskId:
      name: Task ID
      description: ID of the task in TickTick.
      required: true
      example: 63b7bebb91c0a5474805fcd4
      selector:
        text: null
create_task:
  name: Create Task
  description: "Creates a task in TickTick."
  fields:
    projectId:
      name: Project ID
      description: ID of the project (list) of tasks in TickTick.
      required: true
      example: 6987a8plg0rad90bc38b672f
      selector:
        text: null
    title:
      name: Title
      description: "Task title."
      required: true
      example: To buy a cofee
      selector:
        text: null
    content:
      name: Content
      description: "Task content."
      example: Cofee for the author and for myself.
      selector:
        text: null
    desc:
      name: Description
      description: "Description of the checklist."
      selector:
        text: null
    isAllDay:
      name: Lasts all day
      description: "Flag indicating Whether the task is all day."
      selector:
        boolean: null
    startDate:
      name: Start Date
      description: "Start date and time in 'yyyy-MM-dd HH:mm:ss' format."
      example: 2024-12-29 03:00:00
      selector:
        datetime: {}
    dueDate:
      name: Due Date
      description: "Due date and time in 'yyyy-MM-dd HH:mm:ss' format."
      example: 2025-01-10T03:00:00
      selector:
        datetime: {}

    timeZone:
      name: Time Zone
      description: "The time zone in which the time is specified."
      selector:
        text: null

    repeatFlag:
      name: Repeat Flag
      description: "Recurring rules of the task."
      selector:
        text: null
    reminders:
      name: Reminders
      description: "Reminders triggers for a task in iCalendar format i.e TRIGGER:P0DT9H0M0S"
      example: "TRIGGER:P0DT9H0M0S"
      selector:
        text:
          multiple: true
    priority:
      name: Priority
      description: "The priority of the task."
      selector:
        select:
          options:
            - LOW
            - MEDIUM
            - HIGH
    sortOrder:
      name: Sort Order
      description: "The order of the task."
      selector:
        number:
          min: 0
          max: 1000
complete_task:
  name: Complete Task
  description: "Sets a task as done, completes a task in TickTick"
  fields:
    projectId:
      name: Project ID
      description: ID of the project (list) of tasks in TickTick.
      required: true
      example: 6987a8plg0rad90bc38b672f
      selector:
        text: null
    taskId:
      name: Task ID
      description: ID of the task in TickTick.
      required: true
      example: 63b7bebb91c0a5474805fcd4
      selector:
        text: null
delete_task:
  name: Delete Task
  description: "Deletes a task from TickTick"
  fields:
    projectId:
      name: Project ID
      description: ID of the project (list) of tasks in TickTick.
      required: true
      example: 6987a8plg0rad90bc38b672f
      selector:
        text: null
    taskId:
      name: Task ID
      description: ID of the task in TickTick.
      required: true
      example: 63b7bebb91c0a5474805fcd4
      selector:
        text: null
get_projects:
  name: Get Projects
  description: "Returns a list of your projects basic information from TickTick"
get_project:
  name: Get Project
  description: "Returns a project by Project ID basic information from TickTick"
  fields:
    projectId:
      name: Project ID
      description: ID of the project (list) of tasks in TickTick.
      required: true
      example: 6987a8plg0rad90bc38b672f
      selector:
        text: null
get_detailed_project:
  name: Get Project with tasks
  description: "Returns a project by Project ID and its tasks information from TickTick"
  fields:
    projectId:
      name: Project ID
      description: ID of the project (list) of tasks in TickTick.
      required: true
      example: 6987a8plg0rad90bc38b672f
      selector:
        text: null
create_project:
  name: Create project
  description: "Creates a project in TickTick."
  fields:
    name:
      name: Name
      description: "Name of the project."
      required: true
      example: "Shopping list"
      selector:
        text: null
    color:
      name: Project Color
      description: "Color of the project"
      example: "#F18181"
      selector:
        text: null
    sortOrder:
      name: Sort Order
      description: "Sort order value of the project."
      selector:
        number:
          min: 0
          max: 1000
    viewMode:
      name: View Mode
      description: "View mode of the project."
      selector:
        select:
          options:
            - list
            - kanban
            - timeline
    kind:
      name: Project Kind
      description: "Kind of the project."
      selector:
        select:
          options:
            - TASK
            - NOTE
delete_project:
  name: Delete Project
  description: "Deletes a project by Project ID from TickTick"
  fields:
    projectId:
      name: Project ID
      description: ID of the project (list) of tasks in TickTick.
      required: true
      example: 6987a8plg0rad90bc38b672f
      selector:
        text: null
